buildscript {
  repositories {
    gradlePluginPortal()
  }
  if (GradleVersion.current() >= GradleVersion.version('7.4')) {
    dependencies {
      classpath 'com.gradle.plugin-publish:com.gradle.plugin-publish.gradle.plugin:2.1.1'
    }
  }
}

apply plugin: 'java-gradle-plugin'
apply plugin: 'maven-publish'
if (GradleVersion.current() >= GradleVersion.version('7.4')) {
  apply plugin: 'com.gradle.plugin-publish'
}

group = 'zym.top.blackobfuscator'
description = 'BlackObfuscator Gradle plugin for Android APK post-processing'

configurations {
  bundled {
    canBeConsumed = false
    canBeResolved = true
    transitive = true
  }
}

dependencies {
  compileOnly gradleApi()
  compileOnly project(':dex-tools')
  implementation 'com.google.guava:guava:31.1-jre'
  bundled project(':dex-tools')
}

gradlePlugin {
  website = 'https://github.com/0728lzy/BlackObfuscator'
  vcsUrl = 'https://github.com/0728lzy/BlackObfuscator.git'
  plugins {
    blackObfuscatorPlugin {
      id = 'zym.top.blackobfuscator'
      implementationClass = 'zym.top.blackobfuscator.gradle.BlackObfuscatorGradlePlugin'
      displayName = 'BlackObfuscator Gradle Plugin'
      description = 'Obfuscate Android APK dex files after assemble and re-sign the output APK.'
      tags.set(['android', 'apk', 'obfuscation', 'dex'])
    }
  }
}

jar {
  dependsOn configurations.bundled
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  from {
    configurations.bundled.collect { it.isDirectory() ? it : zipTree(it) }
  }
  exclude 'com/google/common/**'
  exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

publishing {
  repositories {
    maven {
      name = 'GitHubPackages'
      url = uri('https://maven.pkg.github.com/0728lzy/BlackObfuscator')
      credentials {
        username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
        password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
      }
    }
  }

  publications.withType(MavenPublication).configureEach {
    pom.withXml {
      def dependenciesNode = asNode().get('dependencies')
      dependenciesNode.each { node ->
        node.children().findAll {
          it.name() == 'dependency' && it.groupId?.text() == 'com.github.CodingGay.BlackObfuscator'
        }.each { dependency ->
          node.remove(dependency)
        }
        if (!node.children()) {
          asNode().remove(node)
        }
      }
    }
  }
}
